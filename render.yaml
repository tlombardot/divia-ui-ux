services:
  - type: web
    name: diviakhaaa-server
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
